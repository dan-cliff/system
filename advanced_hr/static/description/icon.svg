<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/><stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A55B0"/><stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A3F8F" flood-opacity="0.28"/>
    </filter>
    <clipPath id="cardClip"><rect x="170" y="150" width="520" height="730" rx="72"/></clipPath>
  </defs>

  <ellipse cx="512" cy="930" rx="380" ry="30" fill="url(#shadow)"/>

  <!-- Lanyard clip -->
  <rect x="380" y="70" width="100" height="120" rx="30" fill="url(#navy)"/>
  <rect x="404" y="96" width="52" height="40" rx="14" fill="#F2F2FA" opacity="0.9"/>

  <!-- ID badge -->
  <g filter="url(#soft)">
    <rect x="170" y="150" width="520" height="730" rx="72" fill="url(#panel)"/>
    <g clip-path="url(#cardClip)">
      <rect x="170" y="150" width="520" height="190" fill="url(#rim)"/>
      <path d="M170 340 C 330 300 530 380 690 330 L 690 360 L 170 360 Z" fill="url(#panel)"/>
    </g>
  </g>
  <rect x="380" y="196" width="100" height="22" rx="11" fill="#FFFFFF" opacity="0.55"/>
  <rect x="228" y="168" width="220" height="12" rx="6" fill="#FFFFFF" opacity="0.28"/>

  <!-- Photo: a person as a circle and a rounded body -->
  <circle cx="430" cy="420" r="112" fill="#FFFFFF"/>
  <circle cx="430" cy="420" r="100" fill="url(#blue)" opacity="0.14"/>
  <circle cx="430" cy="392" r="50" fill="url(#blue)"/>
  <path d="M348 500 a82 66 0 0 1 164 0 v4 a14 14 0 0 1 -14 14 h-136 a14 14 0 0 1 -14 -14 z" fill="url(#blue)"/>
  <ellipse cx="414" cy="370" rx="20" ry="11" fill="#FFFFFF" opacity="0.45"/>

  <!-- Name and details -->
  <rect x="262" y="580" width="336" height="34" rx="17" fill="#A9ABDC"/>
  <rect x="300" y="640" width="260" height="24" rx="12" fill="#C9CAEA"/>
  <rect x="262" y="720" width="120" height="26" rx="13" fill="url(#yellow)"/>
  <rect x="262" y="770" width="180" height="20" rx="10" fill="#D9DAF0"/>

  <!-- Accent: the team, overlapping the lower right corner -->
  <g filter="url(#lift)">
    <circle cx="738" cy="716" r="190" fill="url(#teal)"/>
  </g>
  <ellipse cx="690" cy="580" rx="70" ry="22" fill="#FFFFFF" opacity="0.22"/>
  <!-- second figure (soft pink), behind -->
  <circle cx="808" cy="664" r="44" fill="#F9A3A3"/>
  <path d="M736 778 a72 60 0 0 1 144 0 v6 a12 12 0 0 1 -12 12 h-120 a12 12 0 0 1 -12 -12 z" fill="#F9A3A3"/>
  <!-- main figure (white), with a gap in the tile colour -->
  <circle cx="698" cy="680" r="62" fill="url(#teal)"/>
  <circle cx="698" cy="680" r="52" fill="#FFFFFF"/>
  <path d="M592 820 a106 84 0 0 1 212 0 v6 a14 14 0 0 1 -14 14 h-184 a14 14 0 0 1 -14 -14 z" fill="url(#teal)" transform="translate(0 -8)"/>
  <path d="M602 812 a96 76 0 0 1 192 0 v4 a12 12 0 0 1 -12 12 h-168 a12 12 0 0 1 -12 -12 z" fill="#FFFFFF"/>
</svg>
