<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Project app icon (CLAUDE.md > Icon style, illustrated): a browser window
       showing a project plan as a Gantt chart (phase rows with staggered bars
       joined by a link), with a milestone flag badge overlapping its lower
       right corner. -->
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A3A3"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#2A3F8F" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowSmall" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Browser window -->
  <g filter="url(#shadow)">
    <rect x="96" y="150" width="740" height="640" rx="64" fill="url(#panel)"/>
    <path d="M160 150h612a64 64 0 0 1 64 64v58H96v-58a64 64 0 0 1 64-64z" fill="url(#header)"/>
    <circle cx="180" cy="211" r="22" fill="#FF5A6E"/>
    <circle cx="246" cy="211" r="22" fill="#FFC93C"/>
    <circle cx="312" cy="211" r="22" fill="#14C9A5"/>
  </g>

  <!-- Row labels ("text" bars) and faint grid -->
  <rect x="150" y="330" width="96" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="150" y="430" width="70" height="26" rx="13" fill="#A9ABDC" opacity="0.8"/>
  <rect x="150" y="530" width="96" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="150" y="630" width="70" height="26" rx="13" fill="#A9ABDC" opacity="0.8"/>
  <rect x="276" y="306" width="6" height="430" rx="3" fill="#A9ABDC" opacity="0.35"/>

  <!-- Link between bars -->
  <path d="M520 343 H556 V443 H588" fill="none" stroke="#5B3DB8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Gantt bars -->
  <rect x="306" y="318" width="214" height="50" rx="25" fill="url(#violet)"/>
  <rect x="306" y="318" width="214" height="22" rx="11" fill="url(#shine)"/>
  <rect x="590" y="418" width="186" height="50" rx="25" fill="url(#blue)"/>
  <rect x="590" y="418" width="186" height="22" rx="11" fill="url(#shine)"/>
  <rect x="380" y="518" width="250" height="50" rx="25" fill="url(#yellow)"/>
  <rect x="380" y="518" width="250" height="22" rx="11" fill="url(#shine)"/>
  <rect x="306" y="618" width="170" height="50" rx="25" fill="url(#coral)"/>
  <rect x="306" y="618" width="170" height="22" rx="11" fill="url(#shine)"/>

  <!-- Milestone badge -->
  <g filter="url(#shadowSmall)">
    <circle cx="768" cy="736" r="170" fill="url(#teal)"/>
    <circle cx="768" cy="736" r="170" fill="url(#shine)" opacity="0.6"/>
  </g>
  <rect x="694" y="640" width="22" height="200" rx="11" fill="#FFFFFF"/>
  <path d="M716 650 C760 630 790 676 846 656 V748 C790 768 760 722 716 742 Z" fill="#FFFFFF"/>
</svg>
