<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A55B0"/><stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/><stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A3F8F" flood-opacity="0.28"/>
    </filter>
  </defs>
  <ellipse cx="512" cy="926" rx="370" ry="32" fill="url(#shadow)"/>

  <!-- Main object: a task board with three actions -->
  <g filter="url(#soft)">
    <rect x="120" y="150" width="660" height="720" rx="76" fill="url(#rim)"/>
    <rect x="160" y="260" width="580" height="570" rx="44" fill="url(#panel)"/>
  </g>
  <rect x="200" y="190" width="70" height="36" rx="18" fill="#FFFFFF" opacity="0.9"/>
  <rect x="290" y="196" width="200" height="24" rx="12" fill="#FFFFFF" opacity="0.4"/>
  <rect x="190" y="176" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.2"/>

  <!-- Row 1: done -->
  <rect x="200" y="300" width="500" height="140" rx="34" fill="#FFFFFF"/>
  <circle cx="270" cy="370" r="42" fill="url(#teal)"/>
  <path d="M250 372 l14 14 l28 -30" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="336" y="342" width="250" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="336" y="384" width="160" height="20" rx="10" fill="#C9CAEA"/>
  <circle cx="650" cy="370" r="22" fill="url(#navy)"/>

  <!-- Row 2: in progress -->
  <rect x="200" y="470" width="500" height="140" rx="34" fill="#FFFFFF"/>
  <circle cx="270" cy="540" r="42" fill="url(#yellow)"/>
  <path d="M270 540 v-26 M270 540 l20 12" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <rect x="336" y="512" width="250" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="336" y="554" width="200" height="20" rx="10" fill="#C9CAEA"/>
  <circle cx="650" cy="540" r="22" fill="#F9A3A3"/>

  <!-- Row 3: open -->
  <rect x="200" y="640" width="500" height="140" rx="34" fill="#FFFFFF"/>
  <circle cx="270" cy="710" r="42" fill="url(#coral)"/>
  <circle cx="270" cy="710" r="14" fill="#FFFFFF"/>
  <rect x="336" y="682" width="220" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="336" y="724" width="140" height="20" rx="10" fill="#C9CAEA"/>

  <!-- Accent: a "go" badge for assigning out actions -->
  <g filter="url(#lift)">
    <circle cx="770" cy="740" r="160" fill="url(#blue)"/>
  </g>
  <circle cx="770" cy="740" r="124" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.35"/>
  <path d="M700 740 h130 M780 688 l52 52 l-52 52" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M655 660 a140 140 0 0 1 75 -58" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
</svg>
