<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft shadow below -->
  <ellipse cx="500" cy="905" rx="380" ry="34" fill="url(#shadow)"/>

  <!-- List window -->
  <g filter="url(#soft)">
    <rect x="100" y="140" width="740" height="690" rx="72" fill="url(#header)"/>
    <rect x="100" y="250" width="740" height="580" rx="64" fill="url(#panel)"/>
    <rect x="100" y="250" width="740" height="80" fill="url(#panel)"/>
  </g>
  <!-- Highlight and window dots on the header -->
  <rect x="150" y="156" width="640" height="18" rx="9" fill="#FFFFFF" opacity="0.18"/>
  <circle cx="190" cy="198" r="26" fill="url(#coral)"/>
  <circle cx="266" cy="198" r="26" fill="url(#yellow)"/>
  <circle cx="342" cy="198" r="26" fill="url(#teal)"/>

  <!-- Columns: a heading block over a strip of cells each -->
  <rect x="160" y="300" width="160" height="56" rx="20" fill="url(#coral)"/>
  <rect x="350" y="300" width="160" height="56" rx="20" fill="url(#blue)"/>
  <rect x="540" y="300" width="160" height="56" rx="20" fill="url(#teal)"/>
  <g fill="#FFFFFF" opacity="0.3">
    <rect x="176" y="310" width="64" height="12" rx="6"/>
    <rect x="366" y="310" width="64" height="12" rx="6"/>
    <rect x="556" y="310" width="64" height="12" rx="6"/>
  </g>
  <!-- Cells as "text" bars -->
  <g fill="#A9ABDC">
    <rect x="176" y="398" width="120" height="24" rx="12"/>
    <rect x="176" y="470" width="92" height="24" rx="12"/>
    <rect x="176" y="542" width="128" height="24" rx="12"/>
    <rect x="176" y="614" width="100" height="24" rx="12"/>
    <rect x="176" y="686" width="116" height="24" rx="12"/>

    <rect x="366" y="398" width="96" height="24" rx="12"/>
    <rect x="366" y="470" width="128" height="24" rx="12"/>
    <rect x="366" y="542" width="84" height="24" rx="12"/>
    <rect x="366" y="614" width="116" height="24" rx="12"/>
    <rect x="366" y="686" width="92" height="24" rx="12"/>

    <rect x="556" y="398" width="124" height="24" rx="12"/>
    <rect x="556" y="470" width="88" height="24" rx="12"/>
  </g>
  <!-- Row lines -->
  <g fill="#E4E4F4">
    <rect x="160" y="444" width="620" height="6" rx="3"/>
    <rect x="160" y="516" width="620" height="6" rx="3"/>
    <rect x="160" y="588" width="620" height="6" rx="3"/>
    <rect x="160" y="660" width="620" height="6" rx="3"/>
  </g>
  <!-- A column being moved: lifted, tilted -->
  <g filter="url(#soft)" transform="rotate(8 790 330)">
    <rect x="720" y="250" width="150" height="250" rx="28" fill="#FFFFFF"/>
    <rect x="736" y="266" width="118" height="52" rx="18" fill="url(#coral)"/>
    <rect x="750" y="276" width="48" height="12" rx="6" fill="#FFFFFF" opacity="0.3"/>
    <rect x="746" y="346" width="90" height="22" rx="11" fill="#A9ABDC"/>
    <rect x="746" y="400" width="70" height="22" rx="11" fill="#A9ABDC"/>
    <rect x="746" y="454" width="84" height="22" rx="11" fill="#A9ABDC"/>
  </g>

  <!-- Settings accent, overlapping the lower right corner: sliders -->
  <g filter="url(#soft)">
    <circle cx="748" cy="740" r="190" fill="#FFFFFF"/>
    <circle cx="748" cy="740" r="174" fill="url(#yellow)"/>
  </g>
  <path d="M624 660 A146 146 0 0 1 760 584" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"
        fill="none" opacity="0.35"/>
  <!-- Slider tracks -->
  <g fill="#FFFFFF" opacity="0.85">
    <rect x="640" y="666" width="216" height="22" rx="11"/>
    <rect x="640" y="729" width="216" height="22" rx="11"/>
    <rect x="640" y="792" width="216" height="22" rx="11"/>
  </g>
  <!-- Slider knobs -->
  <circle cx="808" cy="677" r="30" fill="#2A3F8F"/>
  <circle cx="690" cy="740" r="30" fill="#FF5A6E"/>
  <circle cx="770" cy="803" r="30" fill="#0A6CF0"/>
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="800" cy="668" r="9"/>
    <circle cx="682" cy="731" r="9"/>
    <circle cx="762" cy="794" r="9"/>
  </g>
</svg>
