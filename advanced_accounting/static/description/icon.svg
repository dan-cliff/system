<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Accounting app icon (CLAUDE.md > Icon style, illustrated): a ledger
       sheet with its columns of figures and a rising bar chart (the books and
       the reports), with a stack of coins overlapping its lower right corner
       (the money the books follow: assets, budgets, payments). -->
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9A3A3"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9F1C"/>
      <stop offset="0.5" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#2A3F8F" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowSmall" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Ledger sheet -->
  <g filter="url(#shadow)">
    <rect x="90" y="130" width="720" height="640" rx="64" fill="url(#panel)"/>
    <path d="M154 130h592a64 64 0 0 1 64 64v56H90v-56a64 64 0 0 1 64-64z" fill="url(#header)"/>
    <rect x="150" y="172" width="220" height="36" rx="18" fill="#FFFFFF" opacity="0.6"/>
    <rect x="610" y="172" width="140" height="36" rx="18" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- Rising bar chart -->
  <rect x="150" y="430" width="70" height="110" rx="18" fill="url(#coral)"/>
  <rect x="245" y="380" width="70" height="160" rx="18" fill="url(#blue)"/>
  <rect x="340" y="320" width="70" height="220" rx="18" fill="url(#violet)"/>
  <rect x="150" y="430" width="70" height="40" rx="18" fill="url(#shine)"/>
  <rect x="245" y="380" width="70" height="40" rx="18" fill="url(#shine)"/>
  <rect x="340" y="320" width="70" height="40" rx="18" fill="url(#shine)"/>

  <!-- Columns of figures: a label bar and an amount bar per row -->
  <g fill="#A9ABDC">
    <rect x="460" y="310" width="120" height="28" rx="14"/>
    <rect x="600" y="310" width="150" height="28" rx="14" opacity="0.7"/>
    <rect x="460" y="372" width="100" height="28" rx="14"/>
    <rect x="600" y="372" width="150" height="28" rx="14" opacity="0.7"/>
    <rect x="460" y="434" width="120" height="28" rx="14"/>
    <rect x="600" y="434" width="110" height="28" rx="14" opacity="0.7"/>
  </g>
  <rect x="150" y="580" width="420" height="28" rx="14" fill="#A9ABDC" opacity="0.7"/>
  <rect x="150" y="642" width="320" height="28" rx="14" fill="#A9ABDC" opacity="0.5"/>
  <!-- the total, underlined -->
  <rect x="600" y="494" width="150" height="8" rx="4" fill="#14A3A3"/>
  <rect x="600" y="516" width="150" height="30" rx="15" fill="url(#header)"/>

  <!-- Accent: a stack of coins, faceted (gold top, darker rims) -->
  <g filter="url(#shadowSmall)">
    <g>
      <path d="M600 860v-48h330v48a165 52 0 0 1-330 0z" fill="url(#goldSide)"/>
      <ellipse cx="765" cy="812" rx="165" ry="52" fill="url(#gold)"/>
    </g>
    <g>
      <path d="M612 780v-48h330v48a165 52 0 0 1-330 0z" fill="url(#goldSide)"/>
      <ellipse cx="777" cy="732" rx="165" ry="52" fill="url(#gold)"/>
    </g>
    <g>
      <path d="M596 700v-48h330v48a165 52 0 0 1-330 0z" fill="url(#goldSide)"/>
      <ellipse cx="761" cy="652" rx="165" ry="52" fill="url(#gold)"/>
      <ellipse cx="761" cy="652" rx="112" ry="32" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.7"/>
      <ellipse cx="720" cy="632" rx="60" ry="12" fill="url(#shine)"/>
    </g>
  </g>
</svg>
