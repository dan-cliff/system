      <rect x="110" y="710" width="680" height="26" rx="10"/>
      <rect x="160" y="600" width="34" height="200" rx="14"/>
      <rect x="300" y="600" width="34" height="200" rx="14"/>
      <rect x="440" y="600" width="34" height="200" rx="14"/>
      <rect x="580" y="600" width="34" height="200" rx="14"/>
      <rect x="720" y="600" width="34" height="200" rx="14"/>
    </g>
  </g>
  <rect x="170" y="146" width="560" height="14" rx="7.0" fill="#FFFFFF" opacity="0.3"/>
  <g filter="url(#lift)">
    <ellipse cx="760" cy="780" rx="118" ry="100" fill="url(#coral)"/>
    <ellipse cx="625" cy="640" rx="44" ry="56" transform="rotate(-25 625 640)" fill="url(#coral)"/>
    <ellipse cx="710" cy="580" rx="46" ry="60" transform="rotate(-8 710 580)" fill="url(#coral)"/>
    <ellipse cx="815" cy="580" rx="46" ry="60" transform="rotate(8 815 580)" fill="url(#coral)"/>
    <ellipse cx="900" cy="640" rx="44" ry="56" transform="rotate(25 900 640)" fill="url(#coral)"/>
  </g>
  <ellipse cx="720" cy="730" rx="44" ry="16" fill="#FFFFFF" opacity="0.3" transform="rotate(-20 720 730)"/>
