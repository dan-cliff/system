  <ellipse cx="512" cy="926" rx="370" ry="32" fill="url(#shadow)"/>

  <defs>
    <clipPath id="scene"><rect x="110" y="130" width="680" height="660" rx="72"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="1" stop-color="#9ED9FF"/>
    </linearGradient>
  </defs>
  <g filter="url(#soft)"><rect x="110" y="130" width="680" height="660" rx="72" fill="url(#sky)"/></g>
  <g clip-path="url(#scene)">
