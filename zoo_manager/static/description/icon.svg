    <ellipse cx="260" cy="270" rx="90" ry="34" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="320" cy="250" rx="60" ry="40" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="250" cy="720" rx="420" ry="250" fill="#14A3A3"/>
    <ellipse cx="700" cy="760" rx="380" ry="230" fill="url(#teal)"/>
    <rect x="300" y="440" width="30" height="150" rx="12" fill="#8E2F7A"/>
    <circle cx="315" cy="420" r="80" fill="#14C9A5"/>
    <circle cx="270" cy="460" r="56" fill="#14A3A3"/>
    <circle cx="365" cy="450" r="58" fill="#12B89A"/>
    <g fill="url(#navy)">
