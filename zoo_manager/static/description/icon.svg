    <linearGradient id="blueH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="0.5" stop-color="#1E90F8"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/><stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A55B0"/><stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#8E2F7A"/>
