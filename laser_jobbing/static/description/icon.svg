<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="nozzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D55A8"/>
      <stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A6E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="gift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft shadow below -->
  <ellipse cx="480" cy="920" rx="380" ry="34" fill="url(#shadow)"/>

  <!-- Main object: a board being engraved -->
  <g filter="url(#soft)">
    <rect x="110" y="330" width="660" height="540" rx="64" fill="url(#board)"/>
  </g>
  <rect x="160" y="380" width="560" height="440" rx="40" fill="url(#panel)"/>
  <path d="M150 380 Q150 346 190 346 L520 346" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"
        fill="none" opacity="0.4"/>

  <!-- Engraved design: a heart and placeholder text bars -->
  <path d="M440 650 C 370 600 320 560 320 505 C 320 465 350 440 388 440 C 414 440 430 455 440 474
           C 450 455 466 440 492 440 C 530 440 560 465 560 505 C 560 560 510 600 440 650 Z"
        fill="#FF5A6E"/>
  <path d="M368 488 Q368 466 390 464" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"
        opacity="0.6"/>
  <rect x="270" y="690" width="340" height="30" rx="15" fill="#A9ABDC"/>
  <rect x="320" y="744" width="240" height="26" rx="13" fill="#A9ABDC" opacity="0.7"/>

  <!-- Laser head with its beam -->
  <rect x="330" y="96" width="220" height="150" rx="40" fill="url(#head)"/>
  <rect x="356" y="116" width="96" height="20" rx="10" fill="#FFFFFF" opacity="0.3"/>
  <rect x="404" y="232" width="72" height="62" rx="18" fill="url(#nozzle)"/>
  <path d="M424 294 L456 294 L446 470 L434 470 Z" fill="url(#beam)"/>
  <circle cx="440" cy="474" r="46" fill="url(#spark)"/>

  <!-- Accent: a gift box, lower right -->
  <g filter="url(#soft)">
    <rect x="640" y="690" width="260" height="210" rx="34" fill="url(#gift)"/>
  </g>
  <rect x="616" y="640" width="308" height="84" rx="28" fill="#3BB8FF"/>
  <rect x="742" y="640" width="56" height="260" fill="#FF5A6E"/>
  <path d="M770 640 C 730 590 680 590 690 622 C 698 646 740 646 770 640 Z" fill="#FF5A6E"/>
  <path d="M770 640 C 810 590 860 590 850 622 C 842 646 800 646 770 640 Z" fill="#F9A3A3"/>
  <path d="M640 668 Q640 652 660 652 L720 652" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"
        fill="none" opacity="0.45"/>
</svg>
