<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="0.55" stop-color="#0A6CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Site: a rounded ground plate the pin stands on -->
  <ellipse cx="470" cy="880" rx="360" ry="44" fill="url(#shadow)"/>
  <rect x="150" y="760" width="640" height="100" rx="50" fill="url(#ground)" filter="url(#soft)"/>
  <rect x="200" y="778" width="260" height="20" rx="10" fill="#FFFFFF" opacity="0.22"/>

  <!-- Location pin -->
  <g filter="url(#soft)">
    <path d="M470 820 C470 820 190 560 190 390 C190 235 315 110 470 110 C625 110 750 235 750 390 C750 560 470 820 470 820 Z"
          fill="url(#pin)"/>
  </g>
  <!-- Highlight on the pin -->
  <path d="M265 300 A230 230 0 0 1 430 160" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round"
        fill="none" opacity="0.3"/>

  <!-- Face of the pin with a person -->
  <circle cx="470" cy="390" r="190" fill="url(#face)"/>
  <circle cx="470" cy="330" r="66" fill="url(#person)"/>
  <path d="M352 510 C352 438 405 404 470 404 C535 404 588 438 588 510 Z" fill="url(#person)"/>
  <circle cx="452" cy="308" r="16" fill="#FFFFFF" opacity="0.35"/>

  <!-- Accent: signed in tick badge overlapping the lower right -->
  <g filter="url(#soft)">
    <circle cx="742" cy="700" r="170" fill="#FFFFFF"/>
    <circle cx="742" cy="700" r="152" fill="url(#badge)"/>
  </g>
  <path d="M640 620 A120 120 0 0 1 760 568" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"
        fill="none" opacity="0.3"/>
  <path d="M672 704 L724 756 L818 652" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
</svg>
