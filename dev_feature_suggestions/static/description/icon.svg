<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/><stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.2"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A3F8F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <ellipse cx="512" cy="912" rx="390" ry="34" fill="url(#shadow)"/>

  <!-- Main object: a forum speech bubble holding idea cards -->
  <g filter="url(#soft)">
    <path d="M150 140 H790 A70 70 0 0 1 860 210 V620 A70 70 0 0 1 790 690 H420 L290 800 L305 690 H150 A70 70 0 0 1 80 620 V210 A70 70 0 0 1 150 140 Z" fill="url(#rim)"/>
    <rect x="118" y="178" width="704" height="474" rx="44" fill="url(#panel)"/>
  </g>
  <rect x="140" y="152" width="660" height="22" rx="11" fill="url(#gloss)"/>

  <!-- idea rows: a vote pill and placeholder text bars -->
  <rect x="160" y="222" width="86" height="86" rx="22" fill="url(#yellow)"/>
  <rect x="272" y="236" width="300" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="272" y="276" width="200" height="22" rx="11" fill="#A9ABDC" opacity="0.6"/>

  <rect x="160" y="342" width="86" height="86" rx="22" fill="url(#blue)"/>
  <rect x="272" y="356" width="260" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="272" y="396" width="170" height="22" rx="11" fill="#A9ABDC" opacity="0.6"/>

  <rect x="160" y="462" width="86" height="86" rx="22" fill="url(#teal)"/>
  <rect x="272" y="476" width="230" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="272" y="516" width="150" height="22" rx="11" fill="#A9ABDC" opacity="0.6"/>

  <!-- Accent: an upvote badge -->
  <g filter="url(#lift)">
    <rect x="566" y="490" width="380" height="380" rx="96" fill="url(#coral)"/>
  </g>
  <rect x="600" y="508" width="312" height="70" rx="35" fill="url(#gloss)"/>
  <path d="M756 584 L852 704 Q862 718 846 722 H800 V792 Q800 808 784 808 H728 Q712 808 712 792 V722 H666 Q650 718 660 704 L756 584 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round"/>
</svg>
