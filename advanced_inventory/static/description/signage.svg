<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A54B0"/>
      <stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <ellipse cx="512" cy="905" rx="380" ry="38" fill="url(#shadow)"/>
  <!-- stand -->
  <rect x="452" y="700" width="120" height="150" rx="20" fill="url(#frame)"/>
  <rect x="330" y="830" width="364" height="44" rx="22" fill="url(#frame)"/>
  <!-- screen -->
  <g filter="url(#soft)">
    <rect x="90" y="150" width="844" height="580" rx="60" fill="url(#frame)"/>
    <rect x="124" y="184" width="776" height="512" rx="36" fill="url(#panel)"/>
    <path d="M160 184 H864 A36 36 0 0 1 900 220 V290 H124 V220 A36 36 0 0 1 160 184 Z" fill="url(#header)"/>
  </g>
  <rect x="164" y="222" width="220" height="30" rx="15" fill="#F2F2FA"/>
  <rect x="740" y="222" width="120" height="30" rx="15" fill="#FFFFFF" opacity="0.55"/>
  <!-- big code block and bars -->
  <rect x="164" y="340" width="250" height="250" rx="36" fill="url(#blue)"/>
  <rect x="190" y="364" width="90" height="20" rx="10" fill="#FFFFFF" opacity="0.5"/>
  <rect x="460" y="350" width="380" height="34" rx="17" fill="#A9ABDC"/>
  <rect x="460" y="420" width="300" height="28" rx="14" fill="#A9ABDC" opacity="0.6"/>
  <rect x="460" y="480" width="340" height="28" rx="14" fill="#A9ABDC" opacity="0.6"/>
  <rect x="460" y="540" width="260" height="28" rx="14" fill="#A9ABDC" opacity="0.6"/>
  <!-- accent: tote overlapping the lower right -->
  <g filter="url(#soft)">
    <rect x="636" y="586" width="300" height="250" rx="48" fill="#FFFFFF"/>
    <rect x="660" y="610" width="252" height="202" rx="36" fill="url(#yellow)"/>
    <rect x="660" y="610" width="252" height="70" rx="30" fill="#FF9F1C" opacity="0.55"/>
    <rect x="740" y="640" width="92" height="22" rx="11" fill="#FFFFFF" opacity="0.8"/>
    <rect x="690" y="720" width="60" height="60" rx="14" fill="url(#teal)"/>
  </g>
</svg>
