<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A54B0"/>
      <stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/>
      <stop offset="1" stop-color="#E8475C"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="500" cy="905" rx="400" ry="40" fill="url(#shadow)"/>

  <!-- rack: back panel, uprights and shelves -->
  <g filter="url(#soft)">
    <rect x="120" y="110" width="620" height="770" rx="56" fill="url(#panel)"/>
    <rect x="120" y="110" width="56" height="770" rx="28" fill="url(#frame)"/>
    <rect x="684" y="110" width="56" height="770" rx="28" fill="url(#frame)"/>
    <rect x="150" y="360" width="560" height="34" rx="17" fill="url(#shelf)"/>
    <rect x="150" y="610" width="560" height="34" rx="17" fill="url(#shelf)"/>
    <rect x="150" y="846" width="560" height="34" rx="17" fill="url(#shelf)"/>
  </g>

  <!-- top shelf: two boxes -->
  <rect x="210" y="190" width="200" height="170" rx="26" fill="url(#yellow)"/>
  <rect x="290" y="190" width="40" height="170" fill="#FF9F1C" opacity="0.55"/>
  <rect x="232" y="206" width="70" height="16" rx="8" fill="#FFFFFF" opacity="0.55"/>
  <rect x="440" y="230" width="200" height="130" rx="26" fill="url(#blue)"/>
  <rect x="462" y="246" width="70" height="16" rx="8" fill="#FFFFFF" opacity="0.5"/>

  <!-- middle shelf: totes -->
  <rect x="210" y="470" width="150" height="140" rx="24" fill="url(#teal)"/>
  <rect x="230" y="486" width="56" height="14" rx="7" fill="#FFFFFF" opacity="0.5"/>
  <rect x="380" y="430" width="150" height="180" rx="24" fill="url(#coral)"/>
  <rect x="400" y="446" width="56" height="14" rx="7" fill="#FFFFFF" opacity="0.5"/>
  <rect x="550" y="500" width="110" height="110" rx="22" fill="url(#yellow)"/>

  <!-- bottom shelf: label bars -->
  <rect x="210" y="700" width="230" height="30" rx="15" fill="#A9ABDC"/>
  <rect x="210" y="756" width="160" height="30" rx="15" fill="#A9ABDC" opacity="0.6"/>

  <!-- accent: location pin on a tile, overlapping the lower right -->
  <g filter="url(#soft)">
    <ellipse cx="760" cy="868" rx="150" ry="44" fill="#FFFFFF"/>
    <ellipse cx="760" cy="862" rx="124" ry="32" fill="url(#teal)"/>
    <path d="M760 880 C 690 790, 610 720, 610 620 A 150 150 0 0 1 910 620 C 910 720, 830 790, 760 880 Z"
          fill="#FFFFFF"/>
    <path d="M760 852 C 700 775, 634 712, 634 622 A 126 126 0 0 1 886 622 C 886 712, 820 775, 760 852 Z"
          fill="url(#pin)"/>
    <circle cx="760" cy="620" r="52" fill="#FFFFFF"/>
    <path d="M690 580 A 90 90 0 0 1 760 540" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="18"
          stroke-linecap="round" fill="none"/>
  </g>
</svg>
