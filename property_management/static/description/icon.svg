<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="chimney" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D55B0"/><stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/><stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="500" cy="926" rx="380" ry="34" fill="url(#shadow)"/>

  <!-- the house -->
  <g filter="url(#soft)">
    <rect x="620" y="170" width="86" height="190" rx="22" fill="url(#chimney)"/>
    <rect x="196" y="420" width="560" height="470" rx="44" fill="url(#wall)"/>
    <path d="M168 452 L476 168 L784 452" fill="url(#roof)" stroke="url(#roof)" stroke-width="64"
          stroke-linejoin="round" stroke-linecap="round"/>
    <!-- roof highlight -->
    <path d="M232 430 L476 206" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- attic window -->
  <circle cx="476" cy="360" r="46" fill="url(#glass)"/>
  <rect x="470" y="314" width="12" height="92" fill="#FFFFFF" opacity="0.85"/>
  <rect x="430" y="354" width="92" height="12" fill="#FFFFFF" opacity="0.85"/>

  <!-- windows -->
  <rect x="256" y="500" width="150" height="130" rx="22" fill="url(#glass)"/>
  <rect x="325" y="500" width="12" height="130" fill="#FFFFFF" opacity="0.85"/>
  <rect x="256" y="559" width="150" height="12" fill="#FFFFFF" opacity="0.85"/>
  <rect x="546" y="500" width="150" height="130" rx="22" fill="url(#glass)"/>
  <rect x="615" y="500" width="12" height="130" fill="#FFFFFF" opacity="0.85"/>
  <rect x="546" y="559" width="150" height="12" fill="#FFFFFF" opacity="0.85"/>

  <!-- door -->
  <path d="M410 890 V748 Q410 690 468 690 H484 Q542 690 542 748 V890 Z" fill="url(#door)"/>
  <circle cx="512" cy="800" r="12" fill="#FFFFFF"/>

  <!-- path / step -->
  <rect x="380" y="872" width="192" height="26" rx="13" fill="#A9ABDC"/>

  <!-- accent: key tag -->
  <g filter="url(#soft)">
    <circle cx="760" cy="740" r="176" fill="url(#tag)"/>
  </g>
  <ellipse cx="740" cy="630" rx="96" ry="34" fill="#FFFFFF" opacity="0.25"/>
  <!-- key glyph -->
  <circle cx="680" cy="740" r="62" fill="none" stroke="#FFFFFF" stroke-width="34"/>
  <rect x="726" y="723" width="168" height="34" rx="17" fill="#FFFFFF"/>
  <rect x="828" y="740" width="30" height="62" rx="12" fill="#FFFFFF"/>
  <rect x="784" y="740" width="30" height="46" rx="12" fill="#FFFFFF"/>
</svg>
