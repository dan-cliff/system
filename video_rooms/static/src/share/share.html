<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Share to a room</title>
<style>
    :root { --bg: #F4F5FB; --panel: #FFFFFF; --fg: #1E2547; --muted: #5E6487; --line: #D9DCEC; --accent: #0A6CF0; --ok: #0FA585; --bad: #E8455B; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12152A; --panel: #1A1E38; --fg: #E9EBF8; --muted: #A9ABDC; --line: #323860; --accent: #3BB8FF; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; }
    main { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 28px; width: min(460px, 100%); display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: var(--muted); }
    input { font: 700 32px ui-monospace, monospace; letter-spacing: .3em; text-align: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
    button { padding: 14px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font: 600 17px system-ui, sans-serif; cursor: pointer; }
    button.stop { background: var(--bad); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { font-weight: 600; min-height: 1.5em; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    video { width: 100%; border-radius: 10px; background: #000; }
</style>
</head>
<body>
<main>
    <h1>Share to a room</h1>
    <p>Type the code shown on the room's screens. Your screen appears on them and, during a call, is shared into it.</p>
    <form id="form">
        <label for="code" class="sr" style="position:absolute;left:-9999px">Room code</label>
        <input id="code" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="000000" required>
    </form>
    <button id="go" type="submit" form="form">Share my screen</button>
    <video id="preview" muted autoplay playsinline hidden></video>
    <button id="stop" class="stop" type="button" hidden>Stop sharing</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script type="module" src="/video_rooms/static/src/share/share.js"></script>
</body>
</html>
