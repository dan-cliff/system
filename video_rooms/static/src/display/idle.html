<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Room</title>
<style>
    :root { --bg: #0B0E22; --panel: #1D2250; --fg: #EEF0FA; --muted: #A9ABDC; --ok: #14C9A5; --soon: #FF9F1C; --busy: #FF5A6E; --dnd: #8E5CF0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 2.2vh/1.35 system-ui, "Segoe UI", sans-serif; overflow: hidden; cursor: none; }
    main { height: 100%; display: grid; grid-template-columns: 1.4fr 1fr; gap: 4vh; padding: 6vh 5vw; }
    .left { display: flex; flex-direction: column; gap: 2.4vh; justify-content: center; }
    h1 { font-size: 7vh; margin: 0; letter-spacing: -.01em; }
    .status { display: inline-flex; align-items: center; gap: 1.4vh; font-size: 4vh; font-weight: 700; }
    .status i { width: 3vh; height: 3vh; border-radius: 50%; background: var(--ok); }
    .soon i { background: var(--soon); } .in_use i { background: var(--busy); } .dnd i { background: var(--dnd); }
    .clock { font-size: 9vh; font-weight: 700; font-variant-numeric: tabular-nums; }
    .date { color: var(--muted); font-size: 3vh; }
    .dnd-banner { background: var(--dnd); border-radius: 2vh; padding: 2vh 2.4vh; font-size: 3.2vh; font-weight: 700; }
    .right { display: flex; flex-direction: column; gap: 2.4vh; justify-content: center; }
    .card { background: var(--panel); border-radius: 2.4vh; padding: 3vh; }
    .card h2 { margin: 0 0 1.4vh; font-size: 2.6vh; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; gap: 2vh; padding: .8vh 0; font-size: 2.8vh; }
    .row b { font-variant-numeric: tabular-nums; min-width: 14ch; }
    .code { font: 700 6vh ui-monospace, monospace; letter-spacing: .14em; }
    .muted { color: var(--muted); }
    .offline { position: fixed; bottom: 2vh; left: 2vh; color: var(--muted); font-size: 2vh; }
</style>
</head>
<body>
<main>
    <section class="left">
        <h1 id="name">Video Room</h1>
        <div id="status" class="status available"><i></i><span>Available</span></div>
        <div id="dnd"></div>
        <div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div>
    </section>
    <section class="right">
        <div class="card"><h2>Today</h2><div id="today" class="muted">Loading…</div></div>
        <div class="card"><h2>Share a laptop</h2>
            <div class="muted">Plug in the HDMI cable, or open <b id="share-url"></b> on the laptop and type:</div>
            <div class="code" id="code">------</div>
        </div>
    </section>
</main>
<div class="offline" id="offline" hidden>Waiting for Odoo…</div>
<script>
    const LABEL = { available: "Available", soon: "Booked soon", in_use: "In use", dnd: "In use" };
    const $ = (id) => document.getElementById(id);
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function tick() {
        const now = new Date();
        $("clock").textContent = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    }
    async function refresh() {
        try {
            const response = await fetch("/video_rooms/node/v1/display/state", { cache: "no-store" });
            if (!response.ok) throw new Error(response.status);
            const room = await response.json();
            const s = room.status || {};
            $("offline").hidden = true;
            $("name").textContent = room.room;
            document.title = room.room;
            $("status").className = `status ${s.availability}`;
            $("status").querySelector("span").textContent = LABEL[s.availability] || "";
            $("date").textContent = s.date || "";
            $("code").textContent = room.share_code || "------";
            $("share-url").textContent = room.share_url || "the Video Rooms share page";
            $("dnd").replaceChildren(...(s.dnd && s.dnd.active ? [el("div", "dnd-banner", `Do not disturb – emergencies only${s.dnd.message ? " · " + s.dnd.message : ""}`)] : []));
            const today = s.today || [];
            $("today").replaceChildren(...(today.length ? today.map((m) => { const row = el("div", "row"); row.append(el("b", "", `${m.start}–${m.end}`), el("span", "", m.title)); return row; }) : [el("div", "muted", "No bookings today.")]));
        } catch (error) {
            $("offline").hidden = false;
        }
    }
    tick(); refresh();
    setInterval(tick, 1000 * 15);
    setInterval(refresh, 1000 * 20);
</script>
</body>
</html>
