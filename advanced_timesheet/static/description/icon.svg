<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/>
      <stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="clockRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="clockFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft shadow below -->
  <ellipse cx="500" cy="905" rx="380" ry="34" fill="url(#shadow)"/>

  <!-- Timesheet window -->
  <g filter="url(#soft)">
    <rect x="100" y="150" width="740" height="680" rx="72" fill="url(#header)"/>
    <rect x="100" y="250" width="740" height="580" rx="64" fill="url(#panel)"/>
    <rect x="100" y="250" width="740" height="80" fill="url(#panel)"/>
  </g>
  <!-- Highlight on the header -->
  <rect x="150" y="166" width="640" height="18" rx="9" fill="#FFFFFF" opacity="0.18"/>
  <!-- Binder rings -->
  <rect x="230" y="110" width="44" height="104" rx="22" fill="#2A3F8F"/>
  <rect x="666" y="110" width="44" height="104" rx="22" fill="#2A3F8F"/>
  <rect x="240" y="120" width="12" height="60" rx="6" fill="#FFFFFF" opacity="0.25"/>
  <rect x="676" y="120" width="12" height="60" rx="6" fill="#FFFFFF" opacity="0.25"/>

  <!-- Day header bars -->
  <g fill="#A9ABDC">
    <rect x="290" y="300" width="70" height="22" rx="11"/>
    <rect x="390" y="300" width="70" height="22" rx="11"/>
    <rect x="490" y="300" width="70" height="22" rx="11"/>
    <rect x="590" y="300" width="70" height="22" rx="11"/>
    <rect x="690" y="300" width="70" height="22" rx="11"/>
  </g>

  <!-- Rows: a label bar, then a cell per day -->
  <g>
    <rect x="160" y="370" width="100" height="26" rx="13" fill="#A9ABDC"/>
    <rect x="286" y="352" width="78" height="62" rx="18" fill="url(#coral)"/>
    <rect x="386" y="352" width="78" height="62" rx="18" fill="url(#coral)"/>
    <rect x="486" y="352" width="78" height="62" rx="18" fill="#E4E4F4"/>
    <rect x="586" y="352" width="78" height="62" rx="18" fill="url(#coral)"/>
    <rect x="686" y="352" width="78" height="62" rx="18" fill="#E4E4F4"/>

    <rect x="160" y="466" width="76" height="26" rx="13" fill="#A9ABDC"/>
    <rect x="286" y="448" width="78" height="62" rx="18" fill="#E4E4F4"/>
    <rect x="386" y="448" width="78" height="62" rx="18" fill="url(#yellow)"/>
    <rect x="486" y="448" width="78" height="62" rx="18" fill="url(#yellow)"/>
    <rect x="586" y="448" width="78" height="62" rx="18" fill="#E4E4F4"/>
    <rect x="686" y="448" width="78" height="62" rx="18" fill="url(#yellow)"/>

    <rect x="160" y="562" width="100" height="26" rx="13" fill="#A9ABDC"/>
    <rect x="286" y="544" width="78" height="62" rx="18" fill="url(#teal)"/>
    <rect x="386" y="544" width="78" height="62" rx="18" fill="#E4E4F4"/>
    <rect x="486" y="544" width="78" height="62" rx="18" fill="url(#teal)"/>
    <rect x="586" y="544" width="78" height="62" rx="18" fill="#E4E4F4"/>

    <rect x="160" y="658" width="76" height="26" rx="13" fill="#A9ABDC"/>
    <rect x="286" y="640" width="78" height="62" rx="18" fill="#E4E4F4"/>
    <rect x="386" y="640" width="78" height="62" rx="18" fill="url(#blue)"/>
    <rect x="486" y="640" width="78" height="62" rx="18" fill="#E4E4F4"/>
  </g>
  <!-- Highlights on the filled cells -->
  <g fill="#FFFFFF" opacity="0.28">
    <rect x="298" y="360" width="40" height="10" rx="5"/>
    <rect x="398" y="360" width="40" height="10" rx="5"/>
    <rect x="598" y="360" width="40" height="10" rx="5"/>
    <rect x="398" y="456" width="40" height="10" rx="5"/>
    <rect x="498" y="456" width="40" height="10" rx="5"/>
    <rect x="698" y="456" width="40" height="10" rx="5"/>
    <rect x="298" y="552" width="40" height="10" rx="5"/>
    <rect x="498" y="552" width="40" height="10" rx="5"/>
    <rect x="398" y="648" width="40" height="10" rx="5"/>
  </g>
  <!-- Totals bar -->
  <rect x="160" y="752" width="420" height="24" rx="12" fill="#D5D6EE"/>

  <!-- Clock accent, overlapping the lower right corner -->
  <g filter="url(#soft)">
    <circle cx="748" cy="728" r="196" fill="#FFFFFF"/>
    <circle cx="748" cy="728" r="180" fill="url(#clockRim)"/>
    <circle cx="748" cy="728" r="138" fill="url(#clockFace)"/>
  </g>
  <path d="M630 650 A150 150 0 0 1 760 572" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"
        fill="none" opacity="0.35"/>
  <!-- Hour marks -->
  <g fill="#A9ABDC">
    <rect x="740" y="604" width="16" height="34" rx="8"/>
    <rect x="740" y="818" width="16" height="34" rx="8"/>
    <rect x="624" y="720" width="34" height="16" rx="8"/>
    <rect x="838" y="720" width="34" height="16" rx="8"/>
  </g>
  <!-- Hands -->
  <path d="M748 728 L748 650" stroke="#2A3F8F" stroke-width="26" stroke-linecap="round"/>
  <path d="M748 728 L810 770" stroke="#FF5A6E" stroke-width="22" stroke-linecap="round"/>
  <circle cx="748" cy="728" r="22" fill="#2A3F8F"/>
  <circle cx="748" cy="728" r="8" fill="#FFFFFF"/>
</svg>
