<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/><stop offset="0.55" stop-color="#0A6CF0"/><stop offset="1" stop-color="#8E5CF0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/><stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2A3F8F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Main object: a chat message bubble with its tail -->
  <g filter="url(#shadow)">
    <path d="M190 150 H770 Q850 150 850 230 V590 Q850 670 770 670 H420 L270 800 Q250 816 252 790 L262 670 H190 Q110 670 110 590 V230 Q110 150 190 150 Z"
          fill="url(#frame)"/>
    <rect x="150" y="190" width="660" height="440" rx="52" fill="url(#panel)"/>
    <path d="M190 150 H770 Q850 150 850 230 V250 Q850 190 770 190 H190 Q110 190 110 250 V230 Q110 150 190 150 Z"
          fill="url(#gloss)"/>
  </g>

  <!-- Message: sender dot and placeholder text bars -->
  <circle cx="250" cy="290" r="50" fill="url(#coral)"/>
  <circle cx="250" cy="274" r="17" fill="#FFFFFF"/>
  <path d="M220 318 Q250 290 280 318 Z" fill="#FFFFFF"/>
  <rect x="330" y="258" width="330" height="30" rx="15" fill="#A9ABDC"/>
  <rect x="330" y="306" width="220" height="26" rx="13" fill="#A9ABDC" opacity="0.7"/>
  <rect x="200" y="392" width="520" height="30" rx="15" fill="#A9ABDC"/>
  <rect x="200" y="446" width="460" height="30" rx="15" fill="#A9ABDC"/>
  <rect x="200" y="500" width="300" height="30" rx="15" fill="url(#teal)"/>

  <!-- Accent: AI sparkles overlapping the lower right corner -->
  <g filter="url(#shadow)">
    <circle cx="760" cy="720" r="190" fill="url(#violet)"/>
    <path d="M760 720 m0 -190 a190 190 0 0 1 164 95 a210 210 0 0 0 -328 0 a190 190 0 0 1 164 -95 Z" fill="url(#gloss)"/>
  </g>
  <path d="M760 580 Q778 702 900 720 Q778 738 760 860 Q742 738 620 720 Q742 702 760 580 Z" fill="url(#yellow)"/>
  <path d="M760 620 Q770 708 830 720 Q770 712 760 640 Z" fill="#FFFFFF" opacity="0.5"/>
  <path d="M880 595 Q886 634 925 640 Q886 646 880 685 Q874 646 835 640 Q874 634 880 595 Z" fill="#FFFFFF"/>
  <path d="M655 805 Q660 833 688 838 Q660 843 655 871 Q650 843 622 838 Q650 833 655 805 Z" fill="#F9A3A3"/>
</svg>
