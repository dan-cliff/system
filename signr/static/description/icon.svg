<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/><stop offset="0.55" stop-color="#5B3DB8"/><stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9ABDC"/><stop offset="1" stop-color="#8E5CF0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5A6E"/><stop offset="1" stop-color="#8E2F7A"/>
    </linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC93C"/><stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D55B0"/><stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A8A"/><stop offset="1" stop-color="#FF5A6E"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/><stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="512" cy="930" rx="360" ry="34" fill="url(#shadow)"/>

  <!-- the document -->
  <g filter="url(#soft)">
    <path d="M222 90 H640 L800 250 V862 Q800 912 750 912 H222 Q172 912 172 862 V140 Q172 90 222 90 Z" fill="url(#frame)"/>
    <path d="M250 136 H620 L754 270 V840 Q754 866 728 866 H250 Q218 866 218 834 V168 Q218 136 250 136 Z" fill="url(#panel)"/>
    <!-- folded corner -->
    <path d="M620 136 L754 270 H660 Q620 270 620 230 Z" fill="url(#fold)"/>
  </g>

  <!-- text bars -->
  <rect x="276" y="214" width="250" height="34" rx="17" fill="#8E5CF0" opacity="0.85"/>
  <rect x="276" y="310" width="418" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="276" y="364" width="372" height="26" rx="13" fill="#A9ABDC" opacity="0.75"/>
  <rect x="276" y="418" width="418" height="26" rx="13" fill="#A9ABDC"/>
  <rect x="276" y="472" width="300" height="26" rx="13" fill="#A9ABDC" opacity="0.75"/>

  <!-- signature and its line -->
  <path d="M282 690 C 312 600, 352 600, 342 668 C 334 724, 380 706, 404 650 C 424 606, 444 640, 440 676
           C 437 704, 470 700, 496 664 C 512 642, 528 650, 534 672 C 540 694, 566 690, 590 668"
        fill="none" stroke="url(#ink)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="276" y="744" width="300" height="14" rx="7" fill="#A9ABDC"/>

  <!-- accent: the pen, over the lower right corner -->
  <g transform="translate(742 690) rotate(40)" filter="url(#soft)">
    <!-- barrel -->
    <rect x="-62" y="-250" width="124" height="300" rx="56" fill="url(#barrel)"/>
    <rect x="-38" y="-226" width="22" height="200" rx="11" fill="#FFFFFF" opacity="0.45"/>
    <!-- cap ring -->
    <rect x="-66" y="-30" width="132" height="54" rx="22" fill="url(#cap)"/>
    <!-- nib -->
    <path d="M-56 24 H56 L14 168 Q0 196 -14 168 Z" fill="url(#nib)"/>
    <path d="M-56 24 H0 V182 Q-6 186 -14 168 Z" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="0" cy="84" r="13" fill="#FFFFFF"/>
    <rect x="-4" y="96" width="8" height="64" rx="4" fill="#FFFFFF"/>
    <!-- clip -->
    <rect x="34" y="-236" width="22" height="168" rx="11" fill="url(#cap)"/>
  </g>
</svg>
