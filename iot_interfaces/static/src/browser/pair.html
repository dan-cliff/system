<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pair this device</title>
<style>
    :root { --bg: #F4F5FB; --fg: #1E2547; --muted: #5E6487; --accent: #0A6CF0; --ok: #0FA585; --bad: #E8455B; --panel: #FFFFFF; --line: #D9DCEC; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12152A; --fg: #E9EBF8; --muted: #A9ABDC; --accent: #3BB8FF; --panel: #1A1E38; --line: #323860; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font: 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; max-width: 440px; width: 100%; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 16px; }
    input { width: 100%; box-sizing: border-box; font: 600 20px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase;
            padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--fg); }
    button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: 600 16px system-ui, sans-serif; }
    .status { margin-top: 14px; font-weight: 600; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
    <h1>Pair this device</h1>
    <p>This links the device to Odoo once. From then on it signs in by itself with its own rolling key.</p>
    <form id="form">
        <label for="code" style="display:block;font-size:13px;color:var(--muted);margin-bottom:6px">Pairing code</label>
        <input id="code" autocomplete="off" placeholder="ABCD-EFGH-JKLM-NPQR" required>
        <button type="submit">Pair</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script type="module">
    import { pair, startSession } from "/iot_interfaces/static/src/browser/iot_browser.js";
    const status = document.getElementById("status");
    const input = document.getElementById("code");
    const show = (text, cls = "") => { status.textContent = text; status.className = "status " + cls; };
    async function run(code) {
        if (!window.isSecureContext || !crypto?.subtle) {
            show("This page must be opened over HTTPS to pair.", "bad");
            return;
        }
        show("Pairing…");
        try {
            const paired = await pair(code);
            show(`Paired as ${paired.name}. Signing in…`, "ok");
            const session = await startSession();
            // Drop the code from the address so it isn't kept in the history.
            history.replaceState(null, "", "/iot/browser/pair");
            show(`Paired as ${paired.name}. Opening…`, "ok");
            location.replace(session.home || "/odoo");
        } catch (error) {
            show(error.message, "bad");
        }
    }
    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); run(input.value); });
    const code = new URLSearchParams(location.search).get("code");
    if (code) { input.value = code; run(code); }
</script>
</body>
</html>
