<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C9A5"/>
      <stop offset="1" stop-color="#14A3A3"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D55A8"/>
      <stop offset="1" stop-color="#2A3F8F"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC93C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F2FA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BB8FF"/>
      <stop offset="1" stop-color="#0A6CF0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E5CF0"/>
      <stop offset="1" stop-color="#5B3DB8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2A3F8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2A3F8F" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2A3F8F" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Soft shadow below -->
  <ellipse cx="500" cy="905" rx="380" ry="34" fill="url(#shadow)"/>

  <!-- Node: a single-board computer -->
  <g filter="url(#soft)">
    <rect x="110" y="190" width="720" height="560" rx="72" fill="url(#board)"/>
  </g>
  <!-- Highlight on top of the board -->
  <rect x="170" y="210" width="600" height="18" rx="9" fill="#FFFFFF" opacity="0.25"/>

  <!-- Mounting holes -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="180" cy="262" r="22"/>
    <circle cx="760" cy="262" r="22"/>
    <circle cx="180" cy="678" r="22"/>
  </g>

  <!-- Pin header -->
  <rect x="250" y="236" width="440" height="64" rx="22" fill="#2A3F8F"/>
  <g fill="url(#yellow)">
    <circle cx="290" cy="268" r="14"/>
    <circle cx="342" cy="268" r="14"/>
    <circle cx="394" cy="268" r="14"/>
    <circle cx="446" cy="268" r="14"/>
    <circle cx="498" cy="268" r="14"/>
    <circle cx="550" cy="268" r="14"/>
    <circle cx="602" cy="268" r="14"/>
    <circle cx="654" cy="268" r="14"/>
  </g>

  <!-- Processor -->
  <rect x="270" y="380" width="230" height="230" rx="40" fill="url(#chip)"/>
  <rect x="294" y="400" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.2"/>
  <rect x="330" y="440" width="110" height="110" rx="24" fill="#5B3DB8" opacity="0.6"/>

  <!-- Traces from the processor -->
  <g fill="#FFFFFF" opacity="0.4">
    <rect x="520" y="420" width="120" height="16" rx="8"/>
    <rect x="520" y="480" width="80" height="16" rx="8"/>
    <rect x="520" y="540" width="110" height="16" rx="8"/>
  </g>

  <!-- Status light -->
  <circle cx="180" cy="520" r="24" fill="#FF5A6E"/>
  <circle cx="173" cy="512" r="8" fill="#FFFFFF" opacity="0.6"/>

  <!-- Ports along the bottom -->
  <rect x="250" y="660" width="150" height="70" rx="20" fill="url(#port)"/>
  <rect x="430" y="660" width="110" height="70" rx="20" fill="url(#port)"/>
  <rect x="272" y="684" width="106" height="22" rx="11" fill="#A9ABDC"/>
  <rect x="452" y="684" width="66" height="22" rx="11" fill="#A9ABDC"/>

  <!-- Connection accent, overlapping the lower right corner -->
  <g filter="url(#soft)">
    <circle cx="748" cy="728" r="196" fill="#FFFFFF"/>
    <circle cx="748" cy="728" r="180" fill="url(#blue)"/>
  </g>
  <path d="M630 650 A150 150 0 0 1 760 572" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"
        fill="none" opacity="0.35"/>
  <!-- Signal waves going up and out -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path d="M638 724 A156 156 0 0 1 858 724" stroke-width="30"/>
    <path d="M676 762 A102 102 0 0 1 820 762" stroke-width="30"/>
  </g>
  <circle cx="748" cy="820" r="30" fill="#FFFFFF"/>
  <!-- Key badge: the rolling key -->
  <g filter="url(#soft)">
    <circle cx="858" cy="600" r="62" fill="url(#violet)"/>
  </g>
  <circle cx="838" cy="600" r="22" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M858 600 L890 600 M878 600 L878 620" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
</svg>
